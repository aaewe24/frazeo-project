<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фразеологизмы в картинках</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFF9ED;
            font-family: "Comfortaa", sans-serif;
            min-height: 100vh;
        }

        .hide-input {
            display: none;
        }

        .hint-msg {
            display: none;
        }

        .card-group {
            display: none; 
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            animation: slideUp 0.8s ease forwards;
        }

        #tab-animals:checked ~ .main-wrapper .animals-list { 
            display: flex; 
        }
        #tab-food:checked ~ .main-wrapper .food-list { 
            display: flex; 
        }
        #tab-tools:checked ~ .main-wrapper .tools-list { 
            display: flex; 
        }

        #tab-animals:checked ~ .main-wrapper .welcome-msg,
        #tab-food:checked ~ .main-wrapper .welcome-msg,
        #tab-tools:checked ~ .main-wrapper .welcome-msg { 
            display: none; 
        }

        #tab-animals:checked ~ .main-wrapper .hint-msg,
        #tab-food:checked ~ .main-wrapper .hint-msg,
        #tab-tools:checked ~ .main-wrapper .hint-msg { 
            display: block; 
        }

        .main-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background-color: #f9e1ca;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 2px solid #e0d1b8;
            position: sticky;
            top: 0;
            height: 100vh;
            color: #5d3740;
        }

        .sidebar h2 {
            margin-bottom: 20px;
            color: #5d4037;
        }

        .sidebar-info {
            margin-top: auto; 
            padding-top: 20px;
            border-top: 1px solid #e0d1b8;
            display: flex;
            flex-direction: column;
            gap: 10px; 
            font-size: 13px;
            color: #a08a70;
        }

        .survey-btn {
            display: block;
            padding: 12px 10px;
            background-color: #5d4037;
            color: #f9e1ca;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            line-height: 1.2;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .survey-btn:hover {
            background-color: #f9e1ca;
            color: #5d4037;
            border-color: #5d4037;
            transform: translateY(-2px);
        }

        .filter-btn {
            background: white;
            border: 2px solid #d4c4a8;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }

        .filter-btn:hover {
            background: #fffdf9;
            transform: translateX(8px);
        }

        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            color: #5d3047;
        }

        .header-p {
            margin: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .card {
            width: 300px;
            height: 450px;
            perspective: 1000px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-12px);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card:hover .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #eee;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media screen and (max-width: 768px) {
            .main-wrapper { 
                flex-direction: column; 
            }

            .sidebar { 
                width: 100%; 
                height: auto; 
                position: relative; 
                padding: 15px; 
                border-right: none; 
                border-bottom: 2px solid #e0d1b8;
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            .sidebar h2, 
            .sidebar-info p { 
                display: none; 
            }

            .sidebar-info {
                order: 10;
                width: 100%;
                border: none;
                margin: 20px 0;
            }

            .survey-btn {
                width: 90%;
                max-width: 300px;
                margin: 0 auto;
                font-size: 14px;
            }

            .filter-btn {
                flex: 1 1 30%;
                min-width: 90px;
                padding: 10px 5px;
                font-size: 12px;
            }

            .content {
                padding: 20px 10px;
            }

            .card {
                width: 280px;
                height: 400px;
                margin: 0 auto 20px auto;
            }
        }
    </style>
</head>
<body>

    <input type="radio" name="tabs" id="tab-animals" class="hide-input">
    <input type="radio" name="tabs" id="tab-food" class="hide-input">
    <input type="radio" name="tabs" id="tab-tools" class="hide-input">

    <div class="main-wrapper">
        <nav class="sidebar">
            <h2>Темы</h2>
            <label for="tab-animals" class="filter-btn">Животные</label>
            <label for="tab-food" class="filter-btn">Еда</label>
            <label for="tab-tools" class="filter-btn">Природа</label>
            
            <div class="sidebar-info">
                <a href="https://forms.yandex.ru/u/69f4692184227c22710006aa/?utm_source=share2&utm_content=success" target="_blank" class="survey-btn">Поделитесь своим мнением!</a>
                <p>Проект по русскому языку</p>
                <p>2026 год</p>
            </div>
        </nav>

        <main class="content">
            <header>
                <h1>Фразеологизмы в картинках</h1>
                <p class="welcome-msg header-p">Выберите тему слева, чтобы карточки появились!</p>
                <p class="hint-msg header-p">Наведите курсор на картинку, чтобы узнать значение!</p>
            </header>

            <div class="card-container">
                <div class="card-group animals-list">
                    <div class="card">
                        <div class="card-inner">
                            <div class="card-front"><img src="img/1.1.png" alt="Лицо"></div>
                            <div class="card-back"><img src="img/1.2.png" alt="Оборот"></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-inner">
                            <div class="card-front"><img src="img/2.1.png" alt="Лицо"></div>
                            <div class="card-back"><img src="img/2.2.png" alt="Оборот"></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-inner">
                            <div class="card-front"><img src="img/3.1.png" alt="Лицо"></div>
                            <div class="card-back"><img src="img/3.2.png" alt="Оборот"></div>
                        </div>
                    </div>
                </div>

                <div class="card-group food-list">
                    <div class="card">
                        <div class="card-inner">
                            <div class="card-front"><img src="img/4.1.png" alt="Лицо"></div>
                            <div class="card-back"><img src="img/4.2.png" alt="Оборот"></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-inner">
                            <div class="card-front"><img src="img/5.1.png" alt="Лицо"></div>
                            <div class="card-back"><img src="img/5.2.png" alt="Оборот"></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-inner">
                            <div class="card-front"><img src="img/6.1.png" alt="Лицо"></div>
                            <div class="card-back"><img src="img/6.2.png" alt="Оборот"></div>
                        </div>
                    </div>
                </div>

                <div class="card-group tools-list">
                    <div class="card">
                        <div class="card-inner">
                            <div class="card-front"><img src="img/7.1.png" alt="Лицо"></div>
                            <div class="card-back"><img src="img/7.2.png" alt="Оборот"></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-inner">
                            <div class="card-front"><img src="img/8.1.png" alt="Лицо"></div>
                            <div class="card-back"><img src="img/8.2.png" alt="Оборот"></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-inner">
                            <div class="card-front"><img src="img/9.1.png" alt="Лицо"></div>
                            <div class="card-back"><img src="img/9.2.png" alt="Оборот"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
